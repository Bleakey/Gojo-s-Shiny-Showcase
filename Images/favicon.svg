<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7a0"/>
      <stop offset="1" stop-color="#e8a400"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#fcc11c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fcc11c" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="16" cy="16" r="14"/></clipPath>
  </defs>

  <!-- soft themed glow -->
  <circle cx="16" cy="16" r="15.5" fill="url(#glow)"/>

  <!-- ball body -->
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="32" height="16" fill="url(#goldTop)"/>
    <rect x="0" y="16" width="32" height="16" fill="#0b0b1c"/>
    <rect x="0" y="14.6" width="32" height="2.8" fill="#11111f"/>
  </g>

  <!-- gold rim + center button -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#fcc11c" stroke-width="2"/>
  <circle cx="16" cy="16" r="4.4" fill="#0b0b1c" stroke="#fcc11c" stroke-width="2"/>
  <circle cx="16" cy="16" r="1.5" fill="#fff7a0"/>

  <!-- shiny sparkle -->
  <path d="M9.5 6 l0.85 2.1 2.1 0.85 -2.1 0.85 -0.85 2.1 -0.85 -2.1 -2.1 -0.85 2.1 -0.85 z" fill="#ffffff"/>
</svg>
