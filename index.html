<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gojo's Shiny Showcase</title>
  <meta name="description" content="Gojo's Shiny Showcase" />
  <meta name="author" content="Chily" />
  <meta name="keywords" content="HTML, CSS, JavaScript, Web, Exemple" />

  <link rel="stylesheet" href="css/bootstrap.css" />
  <link rel="stylesheet" href="index.css" />
  <link rel="icon" href="Images/pokeball.png" />

  <audio id="hover-sound" src="sounds/hover.mp3"></audio>

</head>

<body id="container">

  <div id="background-blur"></div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  <!-- HEADER -->
  <header class="site-header">
    <h1 class="site-title">Gojo's Shiny Showcase</h1>
    <nav class="site-nav">
      <a href="index.html" class="nav-link active">Shiny Showcase</a>
      <a href="grerun.html" class="nav-link">Gym Rerun</a>
    </nav>
  </header>

  <!-- SHOWCASE -->
  <section id="shiny-showcase-section" class="showcase-section">
    <div class="showcase-counter" id="shiny-count"></div>
    <div id="shiny-showcase" class="showcase-grid row justify-content-center"></div>
  </section>

  <script>
    // Particles
    (function() {
      const container = document.getElementById('particles');
      if (!container) return;
      for (let i = 0; i < 50; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 8 + 's';
        p.style.animationDuration = (6 + Math.random() * 8) + 's';
        p.style.setProperty('--size', (2 + Math.random() * 3) + 'px');
        container.appendChild(p);
      }
    })();

    // The showcase is now responsive at every width. Keep the heavier
    // background flourishes for larger screens, but never hide the grid.
    function handleResponsiveShowcase() {
      const showcaseSection = document.getElementById('shiny-showcase-section');
      const bgBlur = document.getElementById('background-blur');

      if (showcaseSection) showcaseSection.style.display = 'block';
      if (bgBlur) bgBlur.style.display = window.innerWidth >= 768 ? 'block' : 'none';
    }

    handleResponsiveShowcase();
    window.addEventListener('resize', handleResponsiveShowcase);
  </script>

  <!-- Pokédex popup (opened by clicking a Pokémon) -->
  <div class="pokedex-modal" id="pokedexModal" aria-hidden="true">
    <div class="pokedex-overlay" data-pokedex-close></div>
    <div class="pokedex-panel" role="dialog" aria-modal="true" aria-labelledby="pdexName">
      <button type="button" class="pokedex-close" id="pokedexClose" aria-label="Close" data-pokedex-close>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z" />
        </svg>
      </button>

      <div class="pokedex-screen">
        <span class="pokedex-dexno" id="pdexNo">No. 000</span>
        <div class="image-wrapper pokedex-stage">
          <i class="ground-shadow"></i>
          <img class="img-fluid main-img" id="pdexImg" src="" alt="">
          <img src="Images/shiny-effect.gif" alt="" class="shiny-effect">
        </div>
      </div>

      <div class="pokedex-readout">
        <h3 class="pokedex-name" id="pdexName">—</h3>
        <ul class="pokedex-stats">
          <li><span>Encounters</span><b id="pdexEnc">—</b></li>
          <li><span>Encounter type</span><b id="pdexMethod">—</b></li>
          <li><span>Status</span><b id="pdexSold">—</b></li>
        </ul>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-brand">Gojo's Shiny Showcase</div>
    <p>Made by Chily</p>
  </footer>

  <div id="screen-warning">
    <div class="warning-content">
      This site requires a larger screen. Please zoom out or use a bigger display.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>

</body>

</html>
